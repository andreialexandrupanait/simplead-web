name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · test · type-check · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pașii rulează în ordinea în care eșecul e cel mai ieftin de citit:
      # întâi lint (eslint + prettier), apoi testele, apoi type-check + build.
      # Oricare pică → tot job-ul (și PR-ul) pică.
      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

      - name: Type-check & build (astro check + astro build)
        run: pnpm build
